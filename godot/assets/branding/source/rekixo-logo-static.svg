<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1737 402" role="img" aria-labelledby="title desc">
  <title id="title">Rekixo logo</title>
  <desc id="desc">Rekixo wordmark with each major logo part separated into individual SVG paths for animation.</desc>
  <style>
