[preset.0]

name="Ludo Paws v2 Android"
platform="Android"
runnable=true
dedicated_server=false
export_filter="all_resources"
include_filter="config/release.local.cfg"
exclude_filter=""
export_path=""
script_export_mode=2

[preset.0.options]

; Same permissions as live v16 (BILLING is added by the Play Billing plugin).
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true

gradle_build/use_gradle_build=true
; Same minimum as live v16 (no players lose the update).
gradle_build/min_sdk="28"
gradle_build/target_sdk="36"
gradle_build/custom_theme_attributes={
"[splash]android:windowSplashScreenBackground": "@color/launch_background",
"[splash]windowSplashScreenBackground": "@color/launch_background",
"[splash]windowSplashScreenAnimatedIcon": "@drawable/launch_logo",
"[splash]android:windowSplashScreenBrandingImage": "@drawable/launch_branding",
"[splash]android:windowSplashScreenAnimationDuration": "0",
"[splash]android:windowBackground": "@drawable/launch_window_background"
}
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="0.2.0-rc"
package/unique_name="com.rekixo.ludopaws.v2rc"
package/name="Ludo Paws V2 RC"
package/signed=true
launcher_icons/main_192x192="res://assets/branding/icon/icon_godot_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/branding/icon/ic_launcher_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/branding/icon/ic_launcher_background.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/branding/icon/ic_launcher_monochrome.png"

[preset.1]

name="Ludo Paws Release (com.rekixo.ludopaws)"
platform="Android"
runnable=false
dedicated_server=false
export_filter="all_resources"
include_filter="config/release.local.cfg"
exclude_filter="tests/*,tools/*,scripts/debug/*,scripts/previews/*,scenes/previews/*"
export_path=""
script_export_mode=2

[preset.1.options]

; Same permissions as live v16 (BILLING is added by the Play Billing plugin).
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true

gradle_build/use_gradle_build=true
; Same minimum as live v16 (no players lose the update).
gradle_build/min_sdk="28"
gradle_build/target_sdk="36"
gradle_build/export_format=1
gradle_build/custom_theme_attributes={
"[splash]android:windowSplashScreenBackground": "@color/launch_background",
"[splash]windowSplashScreenBackground": "@color/launch_background",
"[splash]windowSplashScreenAnimatedIcon": "@drawable/launch_logo",
"[splash]android:windowSplashScreenBrandingImage": "@drawable/launch_branding",
"[splash]android:windowSplashScreenAnimationDuration": "0",
"[splash]android:windowBackground": "@drawable/launch_window_background"
}
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; Must be higher than the versionCode published on Google Play (owner confirms before release).
version/code=17
version/name="2.0.0"
package/unique_name="com.rekixo.ludopaws"
package/name="Ludo Paws"
; The owner signs releases; no keystore or password is ever stored here.
package/signed=false
launcher_icons/main_192x192="res://assets/branding/icon/icon_godot_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/branding/icon/ic_launcher_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/branding/icon/ic_launcher_background.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/branding/icon/ic_launcher_monochrome.png"
