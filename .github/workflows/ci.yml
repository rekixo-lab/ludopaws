name: Ludo Paws CI

on:
  # Small, iterative changes are validated locally and can be grouped on a draft PR.
  # Full CI runs when the batch is marked ready, and on pushes to main.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main, feat/ludopaws-production-readiness, feat/gameplay-polish-futureproof]
  workflow_dispatch:
    inputs:
      run_android_instrumentation:
        description: Run the slower Android emulator/instrumentation suite
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  # Keep one active validation batch per PR (or per pushed branch). A newer commit
  # cancels stale emulator/build jobs instead of consuming more private-repo minutes.
  group: ludopaws-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Repository security gate
        working-directory: .
        run: node scripts/security-check.mjs
      - name: Cloudflare production runtime config tests
        working-directory: .
        run: node --test scripts/cloudflare-runtime-config.test.mjs
      - name: Cloudflare production deploy preflight tests
        working-directory: .
        run: node --test scripts/cloudflare-deploy-preflight.test.mjs
      - name: Account deletion page source checks
        working-directory: .
        run: node scripts/check-account-deletion-pages.mjs
      - name: Pricing and in-app purchase policy contract gate
        working-directory: .
        run: node scripts/check-pricing-policy.mjs
      - name: DOB-free Google Play age access contract
        working-directory: .
        run: node scripts/check-age-entry-policy.mjs
      - name: Server tests
        run: npm test
      - name: Production smoke syntax check
        working-directory: .
        run: node --check scripts/production-game-smoke.mjs
      - name: Cloudflare Worker dry run
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir .wrangler-dry-run

  android:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Ludo Paws consumer brand gate
        run: node scripts/check-ludo-paws-brand.mjs
      - name: Ludo Paws animal asset gate
        run: node scripts/check-ludo-paws-assets.mjs
      - name: Ludo Paws character domain gate
        run: node scripts/check-ludo-paws-character-domain.mjs
      - name: Ludo Paws character selection UX gate
        run: node scripts/check-ludo-paws-selection-ux.mjs
      - name: Ludo Paws pawn rendering gate
        run: node scripts/check-ludo-paws-pawn-rendering.mjs
      - name: Ludo Paws reaction engine gate
        run: node scripts/check-ludo-paws-reactions.mjs
      - name: Ludo Paws game moment gate
        run: node scripts/check-ludo-paws-game-moments.mjs
      - name: Ludo Paws reaction director gate
        run: node scripts/check-ludo-paws-reaction-director.mjs
      - name: Ludo Paws production audio gate
        run: node scripts/check-ludo-paws-audio.mjs
      - name: Ludo Paws gameplay background gate
        run: node scripts/check-ludo-paws-gameplay-background.mjs
      - name: Ludo Paws Quick Chat and settings UI gate
        run: node scripts/check-ludo-paws-quick-chat.mjs
      - name: Ludo Paws animation and FX gate
        run: node scripts/check-ludo-paws-animation-fx.mjs
      - name: Ludo Paws offline integration gate
        run: node scripts/check-ludo-paws-offline-integration.mjs
      - name: Ludo Paws online integration gate
        run: node scripts/check-ludo-paws-online-integration.mjs
      - name: Ludo Paws character schema gate
        run: node scripts/check-ludo-paws-character-schema.mjs
      - name: Ludo Paws animal store gate
        run: node scripts/check-ludo-paws-animal-store.mjs
      - name: Ludo Paws social and Fair Dice hardening gate
        run: node scripts/check-ludo-paws-phase15.mjs
      - name: Android 16 release gate
        run: node scripts/android16-release-check.mjs
      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace
      - name: Release lint
        run: gradle -p android :app:lintRelease --stacktrace
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Verify packaged Android 16 target
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/ludoproof-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/ludoproof-badging.txt
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk > /tmp/ludopaws-debug-permissions.txt
          if grep -Eq 'android.permission.RECORD_AUDIO|com.google.android.gms.permission.AD_ID|android.permission.ACCESS_ADSERVICES_(AD_ID|ATTRIBUTION|TOPICS)|com.android.vending.BILLING' /tmp/ludopaws-debug-permissions.txt; then
            echo "Offline-only debug APK must not request microphone or advertising ID" >&2
            exit 1
          fi
      - name: Assemble release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Verify family release permissions
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          shopt -s nullglob
          release_apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#release_apks[@]}" -eq 0 ]; then
            echo "Release build produced no APK to inspect" >&2
            exit 1
          fi
          for apk in "${release_apks[@]}"; do
            "$AAPT" dump permissions "$apk" > /tmp/ludopaws-release-permissions.txt
            if grep -Eq 'android.permission.RECORD_AUDIO|com.google.android.gms.permission.AD_ID|android.permission.ACCESS_ADSERVICES_(AD_ID|ATTRIBUTION|TOPICS)|com.android.vending.BILLING' /tmp/ludopaws-release-permissions.txt; then
              echo "Restricted audio, ads, or billing permission in release APK: $apk" >&2
              exit 1
            fi
          done
      - name: Bundle release AAB
        run: gradle -p android :app:bundleRelease --stacktrace
      - name: Resolve release dependency inventory
        run: gradle -p android :app:writeReleaseDependencyInventory --console=plain
      - name: Generate CycloneDX SBOM
        run: node scripts/generate-sbom.mjs
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Keep build/test CI status independent of GitHub's shared artifact quota.
        # Official release workflows remain responsible for publishing release evidence.
        continue-on-error: true
        with:
          name: ludoproof-sbom
          path: |
            ludoproof-sbom.cdx.json
            ludoproof-sbom.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Hash Android release evidence
        run: node scripts/hash-android-release.mjs
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Keep build/test CI status independent of GitHub's shared artifact quota.
        # Official release workflows remain responsible for publishing release evidence.
        continue-on-error: true
        with:
          name: ludoproof-release-candidate
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            ludoproof-android-release.json
            ludoproof-android-release.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Keep build/test CI status independent of GitHub's shared artifact quota.
        # Official release workflows remain responsible for publishing release evidence.
        continue-on-error: true
        with:
          name: ludoproof-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  android-instrumentation:
    # Full emulator validation is a batch/release checkpoint, not a prerequisite
    # for each small draft-PR edit. Ready PRs and main pushes still run it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.run_android_instrumentation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/ludopaws-avd
      # UI/device tests must never mutate real production accounts or matches.
      ORG_GRADLE_PROJECT_LUDOPROOF_API_BASE_URL: https://127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"
      - name: Free disk space for Android emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Disk usage before Android emulator cleanup:"
          df -h /tmp
          # The hosted runner image preinstalls large SDKs/toolchains that this Android
          # instrumentation job does not use. Remove only those unrelated directories.
          sudo rm -rf \
            /opt/microsoft \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/miniconda \
            /usr/share/dotnet \
            /usr/share/az* \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/boost
          docker image prune --all --force || true
          docker builder prune --all --force || true
          echo "Disk usage after Android emulator cleanup:"
          df -h /tmp
          available_kb="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
          if [[ ! "$available_kb" =~ ^[0-9]+$ ]] || (( available_kb < 8 * 1024 * 1024 )); then
            echo "Expected at least 8 GiB of free space on /tmp after cleanup." >&2
            exit 1
          fi
      - name: Install emulator and Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Android SDK downloads can occasionally return a truncated emulator
          # archive from the package CDN. Retry the install after discarding only
          # incomplete SDK download/temp state; do not continue without every package.
          packages=(
            "platform-tools"
            "emulator"
            "platforms;android-36"
            "build-tools;35.0.0"
            "system-images;android-35;google_apis;x86_64"
          )
          installed=""
          for attempt in 1 2 3; do
            echo "Installing Android emulator packages (attempt $attempt/3)."
            if "$SDKMANAGER" "${packages[@]}"; then
              installed="true"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SDK package install failed; cleaning partial download state before retry." >&2
              rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/temp" "$SDK_ROOT/.downloadIntermediates"
              sleep $((attempt * 5))
            fi
          done
          if [ "$installed" != "true" ]; then
            echo "Android SDK package installation failed after three attempts." >&2
            exit 1
          fi
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Create Android emulator
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name ludopaws-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          # The Pixel 6 profile's 1080x2400 framebuffer puts unnecessary load
          # on headless SwiftShader during long instrumentation runs. Keep the
          # same 3:~7 aspect ratio while reducing software-rendering pressure.
          AVD_CONFIG="$ANDROID_AVD_HOME/ludopaws-ci.avd/config.ini"
          for setting in "hw.lcd.width=720" "hw.lcd.height=1600" "hw.lcd.density=320"; do
            key="${setting%%=*}"
            if grep -q "^$key=" "$AVD_CONFIG"; then
              sed -i "s|^$key=.*|$setting|" "$AVD_CONFIG"
            else
              printf '%s\n' "$setting" >> "$AVD_CONFIG"
            fi
          done
          "$SDK_ROOT/emulator/emulator" -list-avds | tee /tmp/ludopaws-avd-list.txt
          grep -qx "ludopaws-ci" /tmp/ludopaws-avd-list.txt
      - name: Boot Android emulator
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Pin the SwiftShader backend rather than the generic software selector.
          # Emulator 37.2.12 selected swangle/lavapipe with -gpu software and
          # segfaulted mid-suite on the hosted Linux runner.
          nohup "$SDK_ROOT/emulator/emulator" \
            -avd ludopaws-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -camera-front none \
            -gpu swiftshader \
            -feature -Vulkan \
            > /tmp/ludopaws-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/ludopaws-emulator.pid

          device_ready=""
          for attempt in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before ADB became ready."
              cat /tmp/ludopaws-emulator.log
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -q '^device$'; then
              device_ready="1"
              break
            fi
            sleep 2
          done

          if [ "$device_ready" != "1" ]; then
            echo "Android emulator did not become visible to ADB within 180 seconds."
            cat /tmp/ludopaws-emulator.log
            adb devices -l || true
            exit 1
          fi

          booted=""
          for attempt in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before boot completed."
              cat /tmp/ludopaws-emulator.log
              exit 1
            fi
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done

          if [ "$booted" != "1" ]; then
            echo "Android emulator did not complete boot within 240 seconds after ADB connected."
            cat /tmp/ludopaws-emulator.log
            adb devices -l || true
            exit 1
          fi

          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l
      - name: Android emulator contract tests
        shell: bash
        run: bash scripts/run-android-instrumentation-with-retry.sh
      - name: Collect emulator diagnostics
        if: failure()
        shell: bash
        run: |
          timeout 10s adb logcat -d > /tmp/ludopaws-logcat.txt || true
          timeout 10s adb shell dumpsys activity activities > /tmp/ludopaws-activities.txt || true
          # Preserve emulator crash databases when the native emulator process segfaults.
          if [ -d /tmp/android-runner ]; then
            find /tmp/android-runner -maxdepth 1 -type f -name 'emu-crash-*.db' -exec cp {} /tmp/ \; || true
          fi
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Keep build/test CI status independent of GitHub's shared artifact quota.
        # Official release workflows remain responsible for publishing release evidence.
        continue-on-error: true
        with:
          name: ludoproof-android-instrumentation
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
            /tmp/ludopaws-avd-list.txt
            /tmp/ludopaws-emulator.log
            /tmp/ludopaws-emulator-retry-*.log
            /tmp/emu-crash-*.db
            /tmp/ludopaws-logcat.txt
            /tmp/ludopaws-activities.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Android emulator
        if: always()
        shell: bash
        run: timeout 10s adb emu kill || true

  windows-runner-script:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate PowerShell script syntax
        shell: powershell
        run: |
          $scriptPaths = Get-ChildItem -Path "scripts" -Filter "*.ps1" -File
          if ($scriptPaths.Count -eq 0) {
            Write-Error "No PowerShell scripts found under scripts/."
            exit 1
          }

          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $scriptPath.Name, $_.Message) }
              exit 1
            }
            Write-Host ("{0} PowerShell syntax is valid." -f $scriptPath.Name)
          }
