name: LudoProof Cloudflare Production

# Production deploys require an explicit operator dispatch; merges and variable changes
# CLOUDFLARE_DEPLOY_ENABLED does not opt into automatic pushes; workflow_dispatch is required.
# must never automatically publish code to the live Cloudflare Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ludoproof-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # An explicit dispatch from a feature branch must not publish code to production.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
      LUDOPROOF_SESSION_HMAC_KEY: ${{ secrets.LUDOPROOF_SESSION_HMAC_KEY }}
      LUDOPAWS_AD_SAFETY_REVIEW_APPROVED: ${{ vars.LUDOPAWS_AD_SAFETY_REVIEW_APPROVED }}
      LUDOPAWS_GOOGLE_LINKING_ENABLED: ${{ vars.LUDOPAWS_GOOGLE_LINKING_ENABLED }}
      LUDOPAWS_REFERRALS_ENABLED: ${{ vars.LUDOPAWS_REFERRALS_ENABLED }}
      LUDOPAWS_REFERRAL_POLICY_APPROVED: ${{ vars.LUDOPAWS_REFERRAL_POLICY_APPROVED }}
      LUDOPAWS_REFERRAL_SDK_REVIEW_APPROVED: ${{ vars.LUDOPAWS_REFERRAL_SDK_REVIEW_APPROVED }}
      LUDOPAWS_REFERRAL_RELEASE_VALIDATED: ${{ vars.LUDOPAWS_REFERRAL_RELEASE_VALIDATED }}
      LUDOPAWS_INTEGRITY_PROJECT_NUMBER: ${{ vars.LUDOPAWS_INTEGRITY_PROJECT_NUMBER }}
      LUDOPAWS_PLAY_SIGNING_SHA256: ${{ vars.LUDOPAWS_PLAY_SIGNING_SHA256 }}
      LUDOPAWS_REFERRAL_START_MS: ${{ vars.LUDOPAWS_REFERRAL_START_MS }}
      LUDOPAWS_REFERRAL_MIN_VERSION_CODE: ${{ vars.LUDOPAWS_REFERRAL_MIN_VERSION_CODE }}
      GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      GOOGLE_SIGN_IN_ANDROID_CLIENT_IDS: ${{ vars.GOOGLE_SIGN_IN_ANDROID_CLIENT_IDS }}
      LUDOPROOF_ACCOUNT_WEB_ORIGIN: ${{ vars.LUDOPROOF_ACCOUNT_WEB_ORIGIN }}
      # User-approved internal release: validate matching Android/Worker integration flags.
      GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED }}
      LUDOPROOF_BILLING_ENABLED: ${{ vars.LUDOPROOF_BILLING_ENABLED }}
      LUDOPROOF_ADMOB_SSV_ENABLED: ${{ vars.LUDOPROOF_ADMOB_SSV_ENABLED }}
      LUDOPROOF_AGE_SAFETY_MODE: FAMILY_V2
      LUDOPROOF_ADS_ENABLED: ${{ vars.LUDOPROOF_ADS_ENABLED }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID }}
      LUDOPROOF_ADMOB_REWARD_ITEM: ${{ vars.LUDOPROOF_ADMOB_REWARD_ITEM }}
      LUDOPROOF_WORKER_URL: https://api.ludopaws.rekixo.com

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Prepare explicit Cloudflare runtime variables
        run: node scripts/prepare-cloudflare-runtime-config.mjs

      - name: Test Cloudflare runtime configuration
        run: node --test scripts/cloudflare-runtime-config.test.mjs scripts/referral-runtime-config.test.mjs scripts/referral-health-check.test.mjs

      - name: Verify referral secret bindings before optional activation
        if: ${{ env.LUDOPAWS_REFERRALS_ENABLED == 'true' }}
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          npx --yes wrangler@4.135.0 secret list --format json > "$secret_file"
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const names = new Set((Array.isArray(parsed) ? parsed : parsed.secrets ?? []).map(entry => entry.name));
            const missing = ["LUDOPAWS_INTEGRITY_SERVICE_ACCOUNT_EMAIL", "LUDOPAWS_INTEGRITY_PRIVATE_KEY"].filter(name => !names.has(name));
            if (missing.length) {
              console.error("Referral activation blocked: missing Cloudflare secret bindings: " + missing.join(", "));
              process.exit(2);
            }
          ' "$secret_file"

      - name: Validate production configuration
        run: node scripts/cloudflare-deploy-preflight.mjs

      - name: Verify Google Play service-account secret when Billing is enabled
        if: ${{ env.GOOGLE_PLAY_BILLING_ENABLED == 'true' }}
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          npx --yes wrangler@4.135.0 secret list --format json > "$secret_file"
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const list = Array.isArray(parsed) ? parsed : (parsed.secrets ?? []);
            if (!list.some((item) => item?.name === "GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY")) {
              console.error("Billing is enabled but GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY is missing in Cloudflare.");
              process.exit(2);
            }
          ' "$secret_file"

      - name: Repository security gate
        run: node scripts/security-check.mjs

      - name: Pricing and in-app purchase policy contract gate
        run: node scripts/check-pricing-policy.mjs

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Wrangler production dry run
        working-directory: server
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir .wrangler-production-dry-run

      - name: Deploy Worker
        working-directory: server
        run: npx --yes wrangler@4.135.0 deploy

      - name: Sync server-only runtime secrets
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${LUDOPROOF_SESSION_HMAC_KEY:-}" ]; then
            printf '%s' "$LUDOPROOF_SESSION_HMAC_KEY" | npx --yes wrangler@4.135.0 secret put LUDOPROOF_SESSION_HMAC_KEY
            echo "Synced operator-managed LUDOPROOF_SESSION_HMAC_KEY."
          else
            npx --yes wrangler@4.135.0 secret list --format json > /tmp/ludoproof-secrets.json
            if node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync("/tmp/ludoproof-secrets.json", "utf8"));
              const list = Array.isArray(value) ? value : (value.secrets ?? []);
              process.exit(list.some((entry) => entry?.name === "LUDOPROOF_SESSION_HMAC_KEY") ? 0 : 1);
            '; then
              echo "Preserving existing Cloudflare-managed LUDOPROOF_SESSION_HMAC_KEY."
            else
              generated_hmac="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))')"
              printf '%s' "$generated_hmac" | npx --yes wrangler@4.135.0 secret put LUDOPROOF_SESSION_HMAC_KEY
              unset generated_hmac
              echo "Generated LUDOPROOF_SESSION_HMAC_KEY directly inside the deployment channel."
            fi
            rm -f /tmp/ludoproof-secrets.json
          fi

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$LUDOPROOF_WORKER_URL/health"

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          ready_file="$(mktemp)"
          trap 'rm -f "$ready_file"' EXIT

          status=""
          for attempt in $(seq 1 12); do
            status="$(
              curl --silent --show-error                 --output "$ready_file"                 --write-out '%{http_code}'                 "$LUDOPROOF_WORKER_URL/ready"                 || true
            )"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done

          body="$(cat "$ready_file")"
          echo "Readiness HTTP status: $status"
          echo "Readiness response: $body"

          if [ "$status" != "200" ]; then
            echo "Worker readiness endpoint did not reach HTTP 200." >&2
            exit 22
          fi

          READY_FILE="$ready_file" node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.env.READY_FILE, "utf8"));
            if (body.ready !== true || body.ok !== true) {
              console.error("Worker readiness response is not ready.");
              process.exit(2);
            }
            const expectedRewardedAds = process.env.LUDOPROOF_ADMOB_SSV_ENABLED === "true";
            if ((body.checks?.admobSsvEnabled === true) !== expectedRewardedAds) {
              console.error("The production API hostname is not serving the expected deployed AdMob SSV configuration.");
              process.exit(4);
            }
            // Operational readiness is not independent certification. Until
            // the independent-review gate is deliberately changed,
            // require an explicit false claim (missing is not good enough).
            if (body.productionClaim !== false) {
              console.error("Worker readiness must explicitly report productionClaim=false until independent review is completed.");
              process.exit(3);
            }
            if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? "") ||
                body.deploymentRevision !== process.env.GITHUB_SHA) {
              console.error("Production API is not serving the exact commit dispatched for deployment.");
              process.exit(5);
            }
            console.log("LudoProof API route is operational; Rewarded Ads configuration matches the validated deployment; productionClaim=false.");
          '

      - name: Verify store status route and feature flags
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "$LUDOPROOF_WORKER_URL/api/store/status" > "$status_file"
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (body?.ok !== true || typeof body.billingAvailable !== "boolean" || typeof body.rewardedAdsAvailable !== "boolean" || typeof body.rewardedAdsV2Available !== "boolean") {
              console.error("Branded API /api/store/status response is missing expected boolean feature flags.");
              process.exit(2);
            }
            const expectedBilling = process.env.GOOGLE_PLAY_BILLING_ENABLED === "true";
            const androidBillingEnabled = process.env.LUDOPROOF_BILLING_ENABLED === "true";
            const expectedRewardedAds = process.env.LUDOPROOF_ADMOB_SSV_ENABLED === "true";
            const androidRewardedAds = process.env.LUDOPROOF_ADS_ENABLED === "true";
            const expectedUpdatedAds = expectedRewardedAds;
            if (
              body.billingAvailable !== expectedBilling ||
              androidBillingEnabled !== expectedBilling ||
              body.rewardedAdsAvailable !== expectedRewardedAds ||
              androidRewardedAds !== expectedRewardedAds ||
              body.rewardedAdsV2Available !== expectedUpdatedAds
            ) {
              console.error("Production store status does not match validated feature configuration. One-time Billing and Rewarded Ads flags must match their explicitly configured values.");
              process.exit(3);
            }
            console.log(
              "Branded API store status verified; Billing " +
                (expectedBilling ? "enabled by explicit validated configuration, " : "disabled, ") +
                "Rewarded Ads " +
                (expectedRewardedAds ? "enabled by explicit validated configuration." : "disabled.")
            );
          ' "$status_file"

      - name: Verify referral delivery operational status
        run: node scripts/referral-health-check.mjs

      - name: Verify live production game flow
        run: node scripts/production-game-smoke.mjs
