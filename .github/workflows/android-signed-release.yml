name: LudoProof Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Unused Play versionCode (must be greater than the highest uploaded code)
        type: string
        required: true
      version_name:
        description: Internal testing release version
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  signed-release:
    # Never sign a release from an unmerged feature/PR branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE: ${{ inputs.version_code }}
      ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_NAME: ${{ inputs.version_name }}
      LUDOPROOF_KEYSTORE_BASE64: ${{ secrets.LUDOPROOF_ANDROID_KEYSTORE_BASE64 }}
      LUDOPROOF_RELEASE_STORE_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_STORE_PASSWORD }}
      LUDOPROOF_RELEASE_KEY_ALIAS: ${{ secrets.LUDOPROOF_ANDROID_KEY_ALIAS }}
      LUDOPROOF_RELEASE_KEY_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_KEY_PASSWORD }}
      LUDOPROOF_API_BASE_URL: ${{ vars.LUDOPROOF_API_BASE_URL }}
      LUDOPAWS_AD_SAFETY_REVIEW_APPROVED: ${{ vars.LUDOPAWS_AD_SAFETY_REVIEW_APPROVED }}
      LUDOPAWS_GOOGLE_LINKING_ENABLED: ${{ vars.LUDOPAWS_GOOGLE_LINKING_ENABLED }}
      GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      LUDOPROOF_BILLING_ENABLED: ${{ vars.LUDOPROOF_BILLING_ENABLED }}
      GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED }}
      LUDOPROOF_ADS_ENABLED: ${{ vars.LUDOPROOF_ADS_ENABLED }}
      LUDOPROOF_INTERSTITIAL_ADS_ENABLED: ${{ vars.LUDOPROOF_INTERSTITIAL_ADS_ENABLED }}
      LUDOPROOF_ADMOB_SSV_ENABLED: ${{ vars.LUDOPROOF_ADMOB_SSV_ENABLED }}
      LUDOPROOF_ADMOB_REWARD_ITEM: ${{ vars.LUDOPROOF_ADMOB_REWARD_ITEM }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID }}
      PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify complete CI on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-ci.mjs

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing credential
        shell: bash
        run: |
          set -euo pipefail
          : "${LUDOPROOF_KEYSTORE_BASE64:?Missing LUDOPROOF_ANDROID_KEYSTORE_BASE64 secret}"
          : "${LUDOPROOF_RELEASE_STORE_PASSWORD:?Missing LUDOPROOF_ANDROID_STORE_PASSWORD secret}"
          : "${LUDOPROOF_RELEASE_KEY_ALIAS:?Missing LUDOPROOF_ANDROID_KEY_ALIAS secret}"
          : "${LUDOPROOF_RELEASE_KEY_PASSWORD:?Missing LUDOPROOF_ANDROID_KEY_PASSWORD secret}"

          KEYSTORE="$RUNNER_TEMP/ludoproof-release.jks"
          printf '%s' "$LUDOPROOF_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "LUDOPROOF_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: RC2 release-readiness gate
        run: node scripts/android-release-readiness-check.mjs

      - name: Validate release OAuth, feature flags and production API
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SIGN_IN_WEB_CLIENT_ID" ]; then
            echo "Set the GOOGLE_SIGN_IN_WEB_CLIENT_ID repository variable before creating a signed release." >&2
            exit 2
          fi
          if ! printf '%s' "$GOOGLE_SIGN_IN_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'; then
            echo "GOOGLE_SIGN_IN_WEB_CLIENT_ID is not a valid Google Web OAuth client ID." >&2
            exit 2
          fi

          API_BASE="$LUDOPROOF_API_BASE_URL"
          if [ -z "$API_BASE" ]; then API_BASE="https://api.ludopaws.rekixo.com"; fi
          case "$API_BASE" in https://*) ;; *) echo "LUDOPROOF_API_BASE_URL must use HTTPS." >&2; exit 2 ;; esac

          case "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE" in
            ''|*[!0-9]*) echo "version_code must be a positive integer." >&2; exit 2 ;;
          esac
          if [ "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE" -lt 4 ]; then echo "version_code must be at least 4." >&2; exit 2; fi
          if ! printf '%s' "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "version_name must be a release version." >&2; exit 2
          fi
          APP_BILLING="$LUDOPROOF_BILLING_ENABLED"
          SERVER_BILLING="$GOOGLE_PLAY_BILLING_ENABLED"
          APP_ADS="$LUDOPROOF_ADS_ENABLED"
          INTERSTITIAL_ADS="$LUDOPROOF_INTERSTITIAL_ADS_ENABLED"
          SERVER_ADS="$LUDOPROOF_ADMOB_SSV_ENABLED"
          [ -n "$APP_BILLING" ] || APP_BILLING="false"
          [ -n "$SERVER_BILLING" ] || SERVER_BILLING="false"
          [ -n "$APP_ADS" ] || APP_ADS="false"
          [ -n "$INTERSTITIAL_ADS" ] || INTERSTITIAL_ADS="false"
          [ -n "$SERVER_ADS" ] || SERVER_ADS="false"

          for flag in "$APP_BILLING" "$SERVER_BILLING" "$APP_ADS" "$INTERSTITIAL_ADS" "$SERVER_ADS"; do
            case "$flag" in
              true|false) ;;
              *) echo "Store feature flags must be true or false." >&2; exit 2 ;;
            esac
          done
          if [ "$APP_BILLING" != "$SERVER_BILLING" ]; then
            echo "Android Billing flag must match Worker GOOGLE_PLAY_BILLING_ENABLED." >&2
            exit 2
          fi
          if [ "$APP_ADS" != "$SERVER_ADS" ]; then
            echo "Android Ads flag must match Worker LUDOPROOF_ADMOB_SSV_ENABLED." >&2
            exit 2
          fi

          if [ "$APP_ADS" = "true" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_REWARDED_AD_UNIT_ID" ]; then
              echo "Set real ADMOB_APP_ID and ADMOB_REWARDED_AD_UNIT_ID before enabling production ads." >&2
              exit 2
            fi
            if ! printf '%s' "$ADMOB_APP_ID" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$'; then
              echo "ADMOB_APP_ID is malformed." >&2
              exit 2
            fi
            if ! printf '%s' "$ADMOB_REWARDED_AD_UNIT_ID" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$'; then
              echo "ADMOB_REWARDED_AD_UNIT_ID is malformed." >&2
              exit 2
            fi
            if [ "$ADMOB_REWARDED_AD_UNIT_ID" != "$LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID" ]; then
              echo "Android and Worker AdMob rewarded-unit IDs must match." >&2
              exit 2
            fi
            if [ "$LUDOPROOF_ADMOB_REWARD_ITEM" != "gems" ]; then
              echo 'LUDOPROOF_ADMOB_REWARD_ITEM must be gems.' >&2
              exit 2
            fi
            if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] ||
               [ "$ADMOB_REWARDED_AD_UNIT_ID" = "ca-app-pub-3940256099942544/5224354917" ]; then
              echo "Google sample AdMob IDs are not allowed in a release build." >&2
              exit 2
            fi
          fi

          if [ "$INTERSTITIAL_ADS" = "true" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_INTERSTITIAL_AD_UNIT_ID" ]; then
              echo "Set real ADMOB_APP_ID and ADMOB_INTERSTITIAL_AD_UNIT_ID before enabling post-win interstitial ads." >&2
              exit 2
            fi
            if ! printf '%s' "$ADMOB_APP_ID" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$'; then
              echo "ADMOB_APP_ID is malformed." >&2
              exit 2
            fi
            if ! printf '%s' "$ADMOB_INTERSTITIAL_AD_UNIT_ID" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$'; then
              echo "ADMOB_INTERSTITIAL_AD_UNIT_ID is malformed." >&2
              exit 2
            fi
            if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] ||
               [ "$ADMOB_INTERSTITIAL_AD_UNIT_ID" = "ca-app-pub-3940256099942544/1033173712" ]; then
              echo "Google sample AdMob IDs are not allowed when release interstitial ads are enabled." >&2
              exit 2
            fi
          fi

          ready_json="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API_BASE/ready")"
          printf '%s' "$ready_json" | node scripts/check-referral-release-version.mjs "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE"
          node -e '
            const ready = JSON.parse(process.argv[1]);
            if (ready.ready !== true || ready.ok !== true) {
              console.error("Worker readiness response is not operationally ready.");
              process.exit(2);
            }
            // Do not sign a release against a readiness response that omits or
            // raises a production-certification claim while EntroNex remains in evaluation.
            if (ready.productionClaim !== false) {
              console.error("Worker readiness must explicitly report productionClaim=false until independent review is completed.");
              process.exit(3);
            }
            if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? "") ||
                ready.deploymentRevision !== process.env.GITHUB_SHA) {
              console.error("Signed Android release blocked: live Worker does not match the exact release commit. Deploy main first.");
              process.exit(5);
            }
            console.log("Worker is operationally ready; productionClaim=false.");
          ' "$ready_json"
          capabilities_json="$(curl --fail --silent --show-error "$API_BASE/api/capabilities")"
          node -e '
            const caps = JSON.parse(process.argv[1]);
            if (caps.releaseMode !== "FAMILY_V2" || !caps.multiplayer || caps.voice !== false || caps.freeTextChat !== false ||
                caps.newGoogleLinking !== (process.env.LUDOPAWS_GOOGLE_LINKING_ENABLED === "true")) {
              throw new Error("Live Worker does not match the reviewed family release capabilities.");
            }
          ' "$capabilities_json"
          status_json="$(curl --fail --silent --show-error "$API_BASE/api/store/status")"
          node -e '
            const status = JSON.parse(process.argv[1]);
            const billing = process.argv[2] === "true";
            const ads = process.argv[3] === "true";
            if (status.billingAvailable !== billing || status.rewardedAdsAvailable !== ads ||
                status.rewardedAdsV2Available !== ads) {
              console.error("Worker store-status flags do not match the signed Android build configuration.");
              process.exit(2);
            }
            console.log("Production Worker readiness and enabled store feature flags match the requested Android release.");
          ' "$status_json" "$APP_BILLING" "$APP_ADS"

          APP_ID="$ADMOB_APP_ID"
          REWARDED_ID="$ADMOB_REWARDED_AD_UNIT_ID"
          INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_AD_UNIT_ID"
          PLAY_GAMES_ID="$PLAY_GAMES_PROJECT_ID"
          [ -n "$APP_ID" ] || APP_ID="ca-app-pub-3940256099942544~3347511713"
          [ -n "$REWARDED_ID" ] || REWARDED_ID="ca-app-pub-3940256099942544/5224354917"
          [ -n "$INTERSTITIAL_ID" ] || INTERSTITIAL_ID="ca-app-pub-3940256099942544/1033173712"
          [ -n "$PLAY_GAMES_ID" ] || PLAY_GAMES_ID="0"
          {
            printf 'LUDOPROOF_API_BASE_URL=%s\n' "$API_BASE"
            printf 'LUDOPROOF_BILLING_ENABLED=%s\n' "$APP_BILLING"
            printf 'GOOGLE_PLAY_BILLING_ENABLED=%s\n' "$SERVER_BILLING"
            printf 'LUDOPROOF_ADS_ENABLED=%s\n' "$APP_ADS"
            printf 'LUDOPROOF_INTERSTITIAL_ADS_ENABLED=%s\n' "$INTERSTITIAL_ADS"
            printf 'LUDOPROOF_ADMOB_SSV_ENABLED=%s\n' "$SERVER_ADS"
            printf 'ADMOB_APP_ID=%s\n' "$APP_ID"
            printf 'ADMOB_REWARDED_AD_UNIT_ID=%s\n' "$REWARDED_ID"
            printf 'ADMOB_INTERSTITIAL_AD_UNIT_ID=%s\n' "$INTERSTITIAL_ID"
            printf 'PLAY_GAMES_PROJECT_ID=%s\n' "$PLAY_GAMES_ID"

            # Gradle providers.gradleProperty() does not read the plain workflow environment keys.
            # ORG_GRADLE_PROJECT_* maps the validated release config into actual Gradle project properties.
            printf 'ORG_GRADLE_PROJECT_LUDOPAWS_AD_SAFETY_REVIEW_APPROVED=%s\n' "$LUDOPAWS_AD_SAFETY_REVIEW_APPROVED"
            printf 'ORG_GRADLE_PROJECT_LUDOPROOF_API_BASE_URL=%s\n' "$API_BASE"
            printf 'ORG_GRADLE_PROJECT_LUDOPROOF_BILLING_ENABLED=%s\n' "$APP_BILLING"
            printf 'ORG_GRADLE_PROJECT_LUDOPROOF_ADS_ENABLED=%s\n' "$APP_ADS"
            printf 'ORG_GRADLE_PROJECT_LUDOPROOF_INTERSTITIAL_ADS_ENABLED=%s\n' "$INTERSTITIAL_ADS"
            printf 'ORG_GRADLE_PROJECT_ADMOB_APP_ID=%s\n' "$APP_ID"
            printf 'ORG_GRADLE_PROJECT_ADMOB_REWARDED_AD_UNIT_ID=%s\n' "$REWARDED_ID"
            printf 'ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_AD_UNIT_ID=%s\n' "$INTERSTITIAL_ID"
            printf 'ORG_GRADLE_PROJECT_GOOGLE_SIGN_IN_WEB_CLIENT_ID=%s\n' "$GOOGLE_SIGN_IN_WEB_CLIENT_ID"
            printf 'ORG_GRADLE_PROJECT_PLAY_GAMES_PROJECT_ID=%s\n' "$PLAY_GAMES_ID"
          } >> "$GITHUB_ENV"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Release lint
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Build signed release APK and AAB
        run: |
          gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify family signed release permissions
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          shopt -s nullglob
          release_apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#release_apks[@]}" -eq 0 ]; then
            echo "No signed release APK found for privacy check" >&2
            exit 1
          fi
          for apk in "${release_apks[@]}"; do
            "$AAPT" dump permissions "$apk" > /tmp/ludopaws-signed-permissions.txt
            if grep -Eq 'android.permission.RECORD_AUDIO|com.google.android.gms.permission.AD_ID|android.permission.ACCESS_ADSERVICES_(AD_ID|ATTRIBUTION|TOPICS)' /tmp/ludopaws-signed-permissions.txt; then
              echo "Restricted audio, ads, or billing permission in signed APK: $apk" >&2
              exit 1
            fi
          done

      - name: Resolve and record signed release dependencies
        run: |
          gradle -p android :app:writeReleaseDependencyInventory --console=plain
          node scripts/generate-sbom.mjs
          node scripts/check-dependency-advisories.mjs

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"

      - name: Hash Android release evidence
        run: node scripts/hash-android-release.mjs

      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludopaws-android-internal-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            ludoproof-android-release.json
            ludoproof-android-release.sha256
            ludoproof-sbom.cdx.json
            ludoproof-sbom.sha256
            android/build/reports/release-dependencies.json
          if-no-files-found: error
          retention-days: 90
