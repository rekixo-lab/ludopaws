name: Ludo Paws Policy Website Release
on:
  workflow_dispatch:
    inputs:
      website_commit:
        description: Reviewed commit already merged into ludopaws-website main
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ludopaws-policy-website-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_COMMIT: ${{ inputs.website_commit }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
      LUDOPAWS_PLAY_CONTRACT: /tmp/ludopaws-play-contract.js
    steps:
      - name: Validate immutable website revision
        run: |
          node -e 'const ref = process.env.WEBSITE_COMMIT; if (ref?.length !== 40 || !/^[a-f0-9]+$/.test(ref)) throw Error("Supply a full reviewed commit SHA");'
      - name: Checkout reviewed website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rekixo-lab/ludopaws-website
          ref: ${{ inputs.website_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main ancestry and isolated website target
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node <<'JS'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
          if (config.name !== "ludopaws-website" || config.routes?.length !== 1 ||
              config.routes[0].pattern !== "ludopaws.rekixo.com" || config.routes[0].custom_domain !== true ||
              config.assets?.directory !== ".") throw Error("Website must remain isolated from game API and other Rekixo routes");
          JS
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate public pages and exact Play product grants
        run: |
          curl --fail --silent --show-error --retry 3 https://raw.githubusercontent.com/rekixo-lab/ludopaws/main/server/src/google-play-billing.js --output "$LUDOPAWS_PLAY_CONTRACT"
          node scripts/check-site.mjs
      - name: Website deployment dry run
        run: npx --yes wrangler@4.135.0 deploy --dry-run
      - name: Publish reviewed policy website
        run: npx --yes wrangler@4.135.0 deploy
      - name: Verify live policies and self-service form
        run: |
          node <<'JS'
          const checks = [["/privacy-policy/", ["No age entry is required", "child-directed", "No separate long-term match-proof archive"]],
            ["/pricing.html", ["gems_1500", "1,200 Gems", "remove_ads"]],
            ["/account-deletion/", ["guest-deletion-code", "/api/account/google/login", "/api/account/guest/delete"]],
            ["/assets/account-config.js", ["apps.googleusercontent.com", "api.ludopaws.rekixo.com"]]];
          for (const [path, expected] of checks) {
            let verified = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await fetch("https://ludopaws.rekixo.com" + path, {signal: AbortSignal.timeout(15000),cache:"no-store"});
              const text = await response.text();
              if (response.ok && expected.every(token => text.includes(token)) && !/paws_plus|monthly-auto|365 days/.test(text)) { verified = true; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!verified) throw Error("Live website verification failed: " + path);
            console.log("Verified", path);
          }
          JS
