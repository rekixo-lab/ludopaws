name: Ludo Paws V16 Signed AAB (build only)

# One-time main push trigger when this file first lands. Never publishes to Play
# or deploys Cloudflare. Manual reruns remain available for the same version.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-v16-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ludopaws-v16-bundle
  cancel-in-progress: false

jobs:
  build-v16-aab:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE: "16"
      ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_NAME: "1.0.16"
      ORG_GRADLE_PROJECT_LUDOPROOF_API_BASE_URL: ${{ vars.LUDOPROOF_API_BASE_URL }}
      ORG_GRADLE_PROJECT_LUDOPAWS_AD_SAFETY_REVIEW_APPROVED: ${{ vars.LUDOPAWS_AD_SAFETY_REVIEW_APPROVED }}
      ORG_GRADLE_PROJECT_LUDOPROOF_BILLING_ENABLED: ${{ vars.LUDOPROOF_BILLING_ENABLED }}
      ORG_GRADLE_PROJECT_LUDOPROOF_ADS_ENABLED: ${{ vars.LUDOPROOF_ADS_ENABLED }}
      ORG_GRADLE_PROJECT_LUDOPROOF_INTERSTITIAL_ADS_ENABLED: ${{ vars.LUDOPROOF_INTERSTITIAL_ADS_ENABLED }}
      ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ORG_GRADLE_PROJECT_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ORG_GRADLE_PROJECT_GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      ORG_GRADLE_PROJECT_PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}
      LUDOPROOF_RELEASE_STORE_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_STORE_PASSWORD }}
      LUDOPROOF_RELEASE_KEY_ALIAS: ${{ secrets.LUDOPROOF_ANDROID_KEY_ALIAS }}
      LUDOPROOF_RELEASE_KEY_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Review requested bundle settings
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_CODE" = "16"
          test "$ORG_GRADLE_PROJECT_LUDOPAWS_VERSION_NAME" = "1.0.16"
          test -n "$LUDOPROOF_RELEASE_STORE_PASSWORD"
          test -n "$LUDOPROOF_RELEASE_KEY_ALIAS"
          test -n "$LUDOPROOF_RELEASE_KEY_PASSWORD"
          git diff --quiet HEAD
          echo "Build-only v16 request: no Play upload and no Worker deploy."

      - name: Prepare existing release upload key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LUDOPROOF_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/ludopaws-v16-release.jks"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "LUDOPROOF_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Android tests, release lint and signed AAB/APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify version 16, signature and AAB integrity
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/ludopaws-v16-badging.txt"
          grep -Fq "name='com.rekixo.ludopaws' versionCode='16' versionName='1.0.16'" "$RUNNER_TEMP/ludopaws-v16-badging.txt"
          unzip -t "$AAB" > /dev/null
          mkdir -p release-v16
          cp "$AAB" release-v16/ludopaws-v16-signed.aab
          (cd release-v16 && sha256sum ludopaws-v16-signed.aab > ludopaws-v16-signed.aab.sha256)
          printf 'versionCode=16\nversionName=1.0.16\nsourceCommit=%s\nbuildPurpose=artifact-only-not-published\n' "$GITHUB_SHA" > release-v16/release-metadata.txt
          cat release-v16/release-metadata.txt
          cat release-v16/ludopaws-v16-signed.aab.sha256

      - name: Upload signed version 16 bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludopaws-v16-signed-aab
          path: release-v16/
          if-no-files-found: error
          retention-days: 90
