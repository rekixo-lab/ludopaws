name: Ludo Paws dependency advisories
on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 3'
permissions:
  contents: read
concurrency:
  group: ludopaws-dependency-health
  cancel-in-progress: false
jobs:
  runtime-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Resolve locked runtime and check current advisory database
        run: |
          gradle -p android :app:writeReleaseDependencyInventory --console=plain
          node scripts/generate-sbom.mjs
          node scripts/check-dependency-advisories.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-advisory-evidence
          path: dependency-advisories.json
          if-no-files-found: ignore
          retention-days: 14
