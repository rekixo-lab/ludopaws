name: Ludo Paws Account Deletion and Privacy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/landing-page.html"
      - "docs/account-deletion.html"
      - "docs/privacy-policy.html"
      - "docs/pricing.html"
      - "docs/terms-of-service.html"
      - "docs/referral-terms.html"
      - ".github/workflows/account-deletion-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ludopaws-account-deletion-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Before publisher approval, ordinary pushes must not create a permanently red Pages run.
    # A deliberate workflow_dispatch still runs the validation and fails closed if any gate is unmet.
    if: ${{ vars.LUDOPROOF_WEBSITE_HOSTING == 'github-pages' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.LUDOPROOF_POLICY_RELEASE_APPROVED == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate public website release gates
        env:
          GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
          LUDOPROOF_SUPPORT_EMAIL: ${{ vars.LUDOPROOF_SUPPORT_EMAIL }}
          LUDOPROOF_POLICY_RELEASE_APPROVED: ${{ vars.LUDOPROOF_POLICY_RELEASE_APPROVED }}
          LUDOPROOF_ACCOUNT_WEB_ORIGIN: ${{ vars.LUDOPROOF_ACCOUNT_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          test -f docs/landing-page.html
          test -f docs/account-deletion.html
          test -f docs/privacy-policy.html
          test -f docs/pricing.html
          test -f docs/terms-of-service.html
          test -f docs/referral-terms.html
          if grep -Eq "POLICY_RELEASE_REVIEW_REQUIRED|PRICING_RELEASE_REVIEW_REQUIRED|TERMS_RELEASE_REVIEW_REQUIRED" docs/privacy-policy.html docs/pricing.html docs/terms-of-service.html; then
            echo "A privacy, pricing, or Terms of Service release-review marker remains. Complete publisher/legal review before publishing." >&2
            exit 2
          fi
          if [ "$LUDOPROOF_POLICY_RELEASE_APPROVED" != "true" ]; then
            echo "Set repository variable LUDOPROOF_POLICY_RELEASE_APPROVED=true only after publisher review." >&2
            exit 2
          fi
          if ! printf '%s' "$GOOGLE_SIGN_IN_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'; then
            echo "A valid public Google OAuth Web Client ID is required." >&2
            exit 2
          fi
          if ! printf '%s' "$LUDOPROOF_SUPPORT_EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "A monitored publisher support email is required." >&2
            exit 2
          fi
          if [ "$LUDOPROOF_ACCOUNT_WEB_ORIGIN" != "https://ludopaws.rekixo.com" ]; then
            echo "LUDOPROOF_ACCOUNT_WEB_ORIGIN must match the GitHub Pages origin: https://ludopaws.rekixo.com" >&2
            exit 2
          fi
          node scripts/check-account-deletion-pages.mjs
          node scripts/check-pricing-policy.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Build the deletion and privacy site
        env:
          GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
          LUDOPROOF_SUPPORT_EMAIL: ${{ vars.LUDOPROOF_SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp docs/landing-page.html site/index.html
          cp docs/account-deletion.html site/account-deletion.html
          cp docs/privacy-policy.html site/privacy-policy.html
          cp docs/pricing.html site/pricing.html
          cp docs/terms-of-service.html site/terms-of-service.html
          cp docs/referral-terms.html site/referral-terms.html
          printf '%s\n' 'ludopaws.rekixo.com' > site/CNAME
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            apiBaseUrl: "https://api.ludopaws.rekixo.com",
            googleWebClientId: process.env.GOOGLE_SIGN_IN_WEB_CLIENT_ID,
            supportEmail: process.env.LUDOPROOF_SUPPORT_EMAIL
          };
          fs.writeFileSync(
            "site/config.js",
            "window.LUDO_ACCOUNT_CONFIG = " + JSON.stringify(config) + ";\n",
            { encoding: "utf8", mode: 0o644 }
          );
          NODE

      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site/

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify published public policy routes
        shell: bash
        env:
          LUDOPROOF_PUBLIC_ORIGIN: https://ludopaws.rekixo.com
          GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
          LUDOPROOF_SUPPORT_EMAIL: ${{ vars.LUDOPROOF_SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          fetch_public_page() {
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              "${LUDOPROOF_PUBLIC_ORIGIN}$1"
          }

          home="$(fetch_public_page /)"
          privacy="$(fetch_public_page /privacy-policy.html)"
          pricing="$(fetch_public_page /pricing.html)"
          terms="$(fetch_public_page /terms-of-service.html)"
          referral_terms="$(fetch_public_page /referral-terms.html)"
          deletion="$(fetch_public_page /account-deletion.html)"
          config="$(fetch_public_page /config.js)"

          printf '%s' "$home" | grep -qi "Ludo Paws"
          printf '%s' "$privacy" | grep -qi "Privacy Policy"
          printf '%s' "$pricing" | grep -qi "Pricing"
          printf '%s' "$terms" | grep -qi "Terms of Service"
          printf '%s' "$referral_terms" | grep -qi "Friendship invitation terms"
          printf '%s' "$deletion" | grep -qi "Account and data deletion"
          printf '%s' "$config" | grep -Fq "$GOOGLE_SIGN_IN_WEB_CLIENT_ID"
          printf '%s' "$config" | grep -Fq "$LUDOPROOF_SUPPORT_EMAIL"

          echo "Public site smoke check passed: home, privacy, pricing, terms, account deletion and public sign-in/support configuration are served over HTTPS."
