# Ludo Paws V2 (Godot) signed Play bundle — lives in the PRODUCTION repo (rekixo-lab/ludopaws)
# as .github/workflows/android-godot-release-bundle.yml, with the Godot project in godot/.
# Uses the SAME GitHub secrets / variables and release gates as the live
# android-signed-release.yml; nothing secret is written to the repo, logs or artifacts except
# the signed bundle itself. Manual dispatch from main only, like live. Never uploads to Play.
#   gh workflow run android-godot-release-bundle.yml --ref main -f versionCode=17 -f versionName=2.0.0
name: Ludo Paws Godot Signed Bundle

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Unused Play versionCode (greater than every uploaded code; v16 = 16)
        type: string
        required: true
      versionName:
        description: Version name (for example 2.0.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: godot-signed-bundle
  cancel-in-progress: false

jobs:
  signed-bundle:
    # Never sign a release from an unmerged feature/PR branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_DIR: godot
      GODOT_VERSION: 4.7.2-stable
      BUNDLETOOL_VERSION: 1.18.1
      BUNDLETOOL_SHA256: 675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c
      VERSION_CODE: ${{ inputs.versionCode }}
      VERSION_NAME: ${{ inputs.versionName }}
      # v16 upload certificate (public fingerprint, not a secret): the new bundle must match.
      EXPECTED_CERT_SHA256: "CC:0F:7F:77:19:69:D9:28:DF:A9:0F:26:89:FB:D9:C5:87:07:5F:84:FC:B3:7E:7B:49:D1:04:22:AA:4B:B5:66"
      LUDOPROOF_KEYSTORE_BASE64: ${{ secrets.LUDOPROOF_ANDROID_KEYSTORE_BASE64 }}
      LUDOPROOF_RELEASE_STORE_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_STORE_PASSWORD }}
      LUDOPROOF_RELEASE_KEY_ALIAS: ${{ secrets.LUDOPROOF_ANDROID_KEY_ALIAS }}
      LUDOPROOF_RELEASE_KEY_PASSWORD: ${{ secrets.LUDOPROOF_ANDROID_KEY_PASSWORD }}
      LUDOPROOF_API_BASE_URL: ${{ vars.LUDOPROOF_API_BASE_URL }}
      LUDOPAWS_AD_SAFETY_REVIEW_APPROVED: ${{ vars.LUDOPAWS_AD_SAFETY_REVIEW_APPROVED }}
      GOOGLE_SIGN_IN_WEB_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_WEB_CLIENT_ID }}
      PLAY_GAMES_PROJECT_ID: ${{ vars.PLAY_GAMES_PROJECT_ID }}
      LUDOPROOF_BILLING_ENABLED: ${{ vars.LUDOPROOF_BILLING_ENABLED }}
      GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED }}
      LUDOPROOF_ADS_ENABLED: ${{ vars.LUDOPROOF_ADS_ENABLED }}
      LUDOPROOF_INTERSTITIAL_ADS_ENABLED: ${{ vars.LUDOPROOF_INTERSTITIAL_ADS_ENABLED }}
      LUDOPROOF_ADMOB_SSV_ENABLED: ${{ vars.LUDOPROOF_ADMOB_SSV_ENABLED }}
      LUDOPROOF_ADMOB_REWARD_ITEM: ${{ vars.LUDOPROOF_ADMOB_REWARD_ITEM }}
      LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate inputs, release flags and the production API (live gates)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -gt 16 ] || { echo "versionCode must be a number above 16" >&2; exit 2; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versionName must look like 2.0.0" >&2; exit 2; }
          : "${LUDOPROOF_KEYSTORE_BASE64:?Missing LUDOPROOF_ANDROID_KEYSTORE_BASE64 secret}"
          : "${LUDOPROOF_RELEASE_STORE_PASSWORD:?Missing LUDOPROOF_ANDROID_STORE_PASSWORD secret}"
          : "${LUDOPROOF_RELEASE_KEY_ALIAS:?Missing LUDOPROOF_ANDROID_KEY_ALIAS secret}"
          : "${LUDOPROOF_RELEASE_KEY_PASSWORD:?Missing LUDOPROOF_ANDROID_KEY_PASSWORD secret}"
          printf '%s' "$GOOGLE_SIGN_IN_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$' || { echo "GOOGLE_SIGN_IN_WEB_CLIENT_ID is invalid" >&2; exit 2; }
          [[ "$PLAY_GAMES_PROJECT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "PLAY_GAMES_PROJECT_ID is invalid" >&2; exit 2; }
          # Same API default as the live app (android/app/build.gradle.kts) when the variable is unset.
          API_BASE="$LUDOPROOF_API_BASE_URL"
          if [ -z "$API_BASE" ]; then
            API_BASE="$(grep -A2 'gradleProperty("LUDOPROOF_API_BASE_URL")' android/app/build.gradle.kts | sed -n 's/.*orElse("\(https:[^"]*\)").*/\1/p' | head -1)"
          fi
          case "$API_BASE" in https://*) ;; *) echo "The production API must use HTTPS" >&2; exit 2 ;; esac
          echo "API_BASE=$API_BASE" >> "$GITHUB_ENV"
          flag() { local v="${1:-false}"; case "$v" in true|false) echo "$v" ;; *) echo "Store feature flags must be true or false" >&2; exit 2 ;; esac; }
          APP_BILLING=$(flag "$LUDOPROOF_BILLING_ENABLED"); SERVER_BILLING=$(flag "$GOOGLE_PLAY_BILLING_ENABLED")
          APP_ADS=$(flag "$LUDOPROOF_ADS_ENABLED"); INTERSTITIAL=$(flag "$LUDOPROOF_INTERSTITIAL_ADS_ENABLED"); SERVER_ADS=$(flag "$LUDOPROOF_ADMOB_SSV_ENABLED")
          [ "$APP_BILLING" = "$SERVER_BILLING" ] || { echo "Billing flag must match Worker GOOGLE_PLAY_BILLING_ENABLED" >&2; exit 2; }
          [ "$APP_ADS" = "$SERVER_ADS" ] || { echo "Ads flag must match Worker LUDOPROOF_ADMOB_SSV_ENABLED" >&2; exit 2; }
          if [ "$APP_ADS" = "true" ] || [ "$INTERSTITIAL" = "true" ]; then
            [ "$LUDOPAWS_AD_SAFETY_REVIEW_APPROVED" = "true" ] || { echo "Ads need LUDOPAWS_AD_SAFETY_REVIEW_APPROVED=true (live gate)" >&2; exit 2; }
          fi
          # Real AdMob IDs always (the release config never carries Google's test units).
          printf '%s' "$ADMOB_APP_ID" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$' || { echo "ADMOB_APP_ID is malformed" >&2; exit 2; }
          for unit in "$ADMOB_REWARDED_AD_UNIT_ID" "$ADMOB_INTERSTITIAL_AD_UNIT_ID"; do
            printf '%s' "$unit" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$' || { echo "An AdMob unit ID is malformed" >&2; exit 2; }
          done
          case "$ADMOB_APP_ID$ADMOB_REWARDED_AD_UNIT_ID$ADMOB_INTERSTITIAL_AD_UNIT_ID" in *3940256099942544*) echo "Google sample AdMob IDs are not allowed" >&2; exit 2 ;; esac
          if [ "$APP_ADS" = "true" ]; then
            [ "$ADMOB_REWARDED_AD_UNIT_ID" = "$LUDOPROOF_ADMOB_REWARDED_AD_UNIT_ID" ] || { echo "Android and Worker rewarded-unit IDs must match" >&2; exit 2; }
            [ "$LUDOPROOF_ADMOB_REWARD_ITEM" = "gems" ] || { echo "LUDOPROOF_ADMOB_REWARD_ITEM must be gems" >&2; exit 2; }
          fi
          echo "APP_BILLING=$APP_BILLING" >> "$GITHUB_ENV"
          echo "APP_ADS=$APP_ADS" >> "$GITHUB_ENV"
          echo "APP_INTERSTITIAL=$INTERSTITIAL" >> "$GITHUB_ENV"
          # Read-only readiness check of the live Worker (as the live signed workflow does).
          ready_json="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API_BASE/ready")"
          printf '%s' "$ready_json" | node scripts/check-referral-release-version.mjs "$VERSION_CODE"
          node -e 'const r = JSON.parse(process.argv[1]); if (r.ready !== true || r.ok !== true) { console.error("Worker readiness response is not operationally ready."); process.exit(2); }' "$ready_json"

      - name: Install Godot ${{ env.GODOT_VERSION }}, export templates and bundletool
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATES"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
          cp -r "$RUNNER_TEMP/tpl/templates/." "$TEMPLATES/"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATES=$TEMPLATES" >> "$GITHUB_ENV"
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"

      - name: Android SDK and Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "platform-tools" > /dev/null
          # Throwaway debug keystore for Godot's export checks only; the release is unsigned
          # until the upload key signs it below.
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 3650 > /dev/null 2>&1
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Release configuration (public values from GitHub Variables, never committed)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          umask 077
          cat > config/release.local.cfg <<CFG
          [backend]
          base_url="$API_BASE"
          [features]
          billing_enabled=$APP_BILLING
          ads_enabled=$APP_ADS
          interstitial_ads_enabled=$APP_INTERSTITIAL
          [admob]
          app_id="$ADMOB_APP_ID"
          rewarded_unit_id="$ADMOB_REWARDED_AD_UNIT_ID"
          interstitial_unit_id="$ADMOB_INTERSTITIAL_AD_UNIT_ID"
          [play]
          server_client_id="$GOOGLE_SIGN_IN_WEB_CLIENT_ID"
          games_app_id="$PLAY_GAMES_PROJECT_ID"
          CFG
          sed -i 's/^ *//' config/release.local.cfg
          python3 - <<'PY'
          import os, re
          code, name = os.environ["VERSION_CODE"], os.environ["VERSION_NAME"]
          s = open("export_presets.cfg").read()
          i = s.index("[preset.1]")
          tail = re.sub(r"version/code=\d+", "version/code=" + code, s[i:], count=1)
          tail = re.sub(r'version/name="[^"]*"', 'version/name="%s"' % name, tail, count=1)
          open("export_presets.cfg", "w").write(s[:i] + tail)
          PY

      - name: Godot tests, import check and build template
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          "$GODOT" --headless --editor --path . --quit > import2.log 2>&1 || true
          status=0
          for t in run_tests match_flow_smoke compile_all online_contract_smoke account_contract_smoke growth_smoke rewards_ui_smoke; do
            log="$("$GODOT" --headless --path . --script "res://tests/$t.gd" 2>&1)"; code=$?
            if [ $code -ne 0 ] || grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' <<<"$log"; then
              echo "FAIL: $t"; grep -E 'SCRIPT ERROR|Parse Error|Failed to load|FAIL' <<<"$log" | head -20; status=1
            else
              echo "ok: $t — $(grep -E 'checks|failures' <<<"$log" | tail -1)"
            fi
          done
          [ $status -eq 0 ] || exit 1
          set -e
          LUDOPAWS_RELEASE=1 tools/android/setup_build_template.sh

      - name: Export unsigned release bundle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Ludo Paws Release (com.rekixo.ludopaws)" build/ludopaws-unsigned.aab
          test -s build/ludopaws-unsigned.aab

      - name: Sign with the existing upload key (secrets only in memory / runner temp)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ludoproof-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$LUDOPROOF_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          OUT="build/ludopaws-$VERSION_NAME-$VERSION_CODE.aab"
          cp build/ludopaws-unsigned.aab "$OUT"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE" \
            -storepass:env LUDOPROOF_RELEASE_STORE_PASSWORD -keypass:env LUDOPROOF_RELEASE_KEY_PASSWORD \
            "$OUT" "$LUDOPROOF_RELEASE_KEY_ALIAS" > /dev/null
          jarsigner -verify "$OUT" > /dev/null
          echo "AAB=$OUT" >> "$GITHUB_ENV"

      - name: Verify package, version, v16 certificate, arm64 16 KB, real ads, clean pack
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 tools/release/verify_release_aab.py "$AAB" --bundletool "$BUNDLETOOL" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --expected-cert "$EXPECTED_CERT_SHA256"
          CERT=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2; exit}')
          echo "$CERT" > build/signing-cert-sha256.txt
          (cd build && sha256sum "$(basename "$AAB")" > "$(basename "$AAB").sha256")
          {
            echo "app: Ludo Paws (com.rekixo.ludopaws)"
            echo "versionCode: $VERSION_CODE"
            echo "versionName: $VERSION_NAME"
            echo "source commit (V2 Godot client): $(cat SOURCE_COMMIT 2>/dev/null || echo unknown)"
            echo "merge commit (rekixo-lab/ludopaws main): $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "signing certificate SHA-256: $CERT (matches v16)"
            echo "aab sha256: $(cut -d' ' -f1 "$AAB.sha256")"
            echo "aab size bytes: $(stat -c %s "$AAB")"
            echo "status: not published (upload to Play Console by the owner)"
          } > build/release-metadata.txt
          cat build/release-metadata.txt
          rm -f config/release.local.cfg

      - name: Upload signed bundle (not published to Play)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludopaws-godot-signed-${{ inputs.versionCode }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.AAB }}
            ${{ env.PROJECT_DIR }}/${{ env.AAB }}.sha256
            ${{ env.PROJECT_DIR }}/build/release-metadata.txt
            ${{ env.PROJECT_DIR }}/build/signing-cert-sha256.txt
          if-no-files-found: error
          retention-days: 90
